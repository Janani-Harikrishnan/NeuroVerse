[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swin-fedavg-brats"
version = "1.0.0"
description = "Neuroverse E2 Swin UNETR Federated Learning with FedAvg"
license = {file = "LICENSE"}

dependencies = [
    "flwr[simulation]>=1.30.0",
    "torch==2.10.0",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "monai",
    "einops",
]

[tool.hatch.build.targets.wheel]
packages = ["pytorchexample"]

[tool.flwr.app]
publisher = "neuroverse"
fab-format-version = 1
flwr-version-target = "1.30.0"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-train = 1.0
fraction-evaluate = 1.0
local-epochs = 10
learning-rate = 0.0001
patches-per-epoch = 100