[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "quantum-kernel-e3-brats"
version = "1.0.0"
description = "Neuroverse E3 Swin UNETR Adaptive FL with Quantum-Kernel Update Similarity"
license = {file = "LICENSE"}

dependencies = [
    "flwr[simulation]>=1.30.0",
    "torch==2.10.0",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "monai",
    "einops",
    "qiskit",
]


[tool.hatch.build.targets.wheel]
packages = ["pytorchexample"]


[tool.flwr.app]
publisher = "neuroverse"
fab-format-version = 1
flwr-version-target = "1.30.0"


[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"


[tool.flwr.app.config]
num-server-rounds = 10
fraction-train = 1.0
fraction-evaluate = 0.0
local-epochs = 10
learning-rate = 0.0001
patches-per-epoch = 100


#######################################################################
# FLOWER CONFIGURATION NOTE
#
# SuperLink / local-simulation configuration is maintained in:
#
#     ~/.flwr/config.toml
#
# Do NOT add the old [tool.flwr.federations] section here.
#######################################################################

    